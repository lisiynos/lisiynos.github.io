<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Площадь прямоугольника по формуле шнурка</title>
  <desc id="desc">Прямоугольник A(0,0), B(4,0), C(4,3), D(0,3) обходим против часовой стрелки. Таблица произведений для рёбер AB, BC, CD, DA даёт 0, 12, 12, 0 в прямой сумме и четыре нуля в обратной. Ориентированная удвоенная площадь равна 24, площадь равна 12. При обратном обходе удвоенная площадь равна минус 24, а площадь остаётся 12.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#333" font-size="26">
    <text x="40" y="54" fill="#202d14" font-size="38" font-weight="700">Площадь: формула шнурка</text>
    <text x="40" y="98">Обход A → B → C → D → A против часовой стрелки</text>

    <path d="M100 420H420V180H100Z" fill="#e8f1fb" stroke="#4a6fa5" stroke-width="4"/>
    <g stroke="#4a6fa5" stroke-width="4" marker-end="url(#arrow)">
      <path d="M220 420H290"/><path d="M420 335V265"/>
      <path d="M290 180H220"/><path d="M100 265V335"/>
    </g>
    <g fill="#4a6fa5">
      <circle cx="100" cy="420" r="6"/><circle cx="420" cy="420" r="6"/>
      <circle cx="420" cy="180" r="6"/><circle cx="100" cy="180" r="6"/>
    </g>
    <text x="54" y="460">A(0,0)</text><text x="334" y="460">B(4,0)</text>
    <text x="334" y="156">C(4,3)</text><text x="54" y="156">D(0,3)</text>
    <text x="260" y="295" text-anchor="middle" font-size="38" font-weight="700" fill="#202d14">S = 12</text>
    <text x="260" y="338" text-anchor="middle">4 × 3</text>

    <rect x="500" y="132" width="420" height="294" rx="12" fill="#f4f7f0"/>
    <path d="M500 191H920M500 249H920M500 307H920M500 365H920" stroke="#c9d2c1"/>
    <text x="522" y="171" font-weight="700">Ребро</text>
    <text x="690" y="171" text-anchor="middle" font-weight="700">xᵢ yᵢ₊₁</text>
    <text x="840" y="171" text-anchor="middle" font-weight="700">yᵢ xᵢ₊₁</text>
    <text x="522" y="230">A → B</text><text x="690" y="230" text-anchor="middle">0</text><text x="840" y="230" text-anchor="middle">0</text>
    <text x="522" y="288">B → C</text><text x="690" y="288" text-anchor="middle">12</text><text x="840" y="288" text-anchor="middle">0</text>
    <text x="522" y="346">C → D</text><text x="690" y="346" text-anchor="middle">12</text><text x="840" y="346" text-anchor="middle">0</text>
    <text x="522" y="404">D → A</text><text x="690" y="404" text-anchor="middle">0</text><text x="840" y="404" text-anchor="middle">0</text>
    <text x="510" y="466" font-weight="700">S₂ = 24;  S = |24| / 2 = 12</text>

    <rect x="40" y="508" width="880" height="62" rx="12" fill="#fff3c4"/>
    <text x="62" y="548" font-size="28">Обратный обход: S₂ = −24, площадь S = 12.</text>
  </g>
</svg>
